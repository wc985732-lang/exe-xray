name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: ${{ matrix.os }} · py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.9", "3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      # The signature tests need a genuinely signed binary and skip on hosts that
      # have none. That is a "not proven" skip, never a "proven fine" one, so the
      # tallied skip count is printed and the suite is still allowed to pass.
      - name: Unit tests
        run: python -m unittest discover -s tests -v

      # Fixtures are generated by the test run above (tests/make_fixtures.py).
      # Everything below proves the documented entry point still works.
      - name: CLI smoke test on a synthetic malicious sample
        run: python xray.py tests/fixtures/suspicious.exe --compact

      - name: CLI smoke test on JSON output
        run: python xray.py tests/fixtures/clean.exe --json --no-strings

      - name: Package installs and exposes its entry point
        run: |
          python -m pip install --quiet .
          exe-xray --version

      - name: No stray dependencies crept in
        shell: python
        run: |
          import pathlib, sys, sysconfig
          stdlib = sysconfig.get_paths()["stdlib"]
          local = pathlib.Path(".").resolve()
          offenders = []
          for path in local.rglob("*.py"):
              for line in path.read_text(encoding="utf-8").splitlines():
                  line = line.strip()
                  if not (line.startswith("import ") or line.startswith("from ")):
                      continue
                  mod = line.split()[1].split(".")[0]
                  if mod in ("exe_xray", "make_fixtures", "__future__"):
                      continue
                  if mod in sys.builtin_module_names:
                      continue
                  if not (pathlib.Path(stdlib) / mod).exists() and not (pathlib.Path(stdlib) / f"{mod}.py").exists():
                      if mod not in ("typing", "dataclasses", "collections", "argparse",
                                     "hashlib", "struct", "math", "re", "json", "os",
                                     "sys", "tempfile", "unittest", "io", "random",
                                     "pathlib", "contextlib", "datetime", "enum"):
                          offenders.append(f"{path}: {mod}")
          print("third-party imports:", offenders or "none")
          sys.exit(1 if offenders else 0)
