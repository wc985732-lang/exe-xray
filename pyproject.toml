[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "exe-xray"
version = "0.1.0"
description = "Static, human-readable health check for Windows executables"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "exe-xray contributors" }]
keywords = ["pe", "pefile", "malware-analysis", "triaging", "windows", "reverse-engineering"]
classifiers = [
    "Programming Language :: Python :: 3",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Topic :: Security",
    "Environment :: Console",
]
dependencies = []

[project.scripts]
exe-xray = "exe_xray.cli:main"

[tool.setuptools]
packages = ["exe_xray"]
